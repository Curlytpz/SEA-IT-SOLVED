<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F3EC" />
    <meta name="description" content="SEA-IT-SOLVED is an AI-assisted smart whiteboard platform for mathematics lesson capture, instructor review, learning materials, quizzes, and analytics." />
    <style>
      html.landing-boot,
      html.landing-boot body,
      html.landing-boot #root { background: #0a1612; }
      #landing-boot-splash { display: none; }
      html.landing-boot #landing-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #0a1612;
        color: #f4f1e9;
        opacity: 1;
        visibility: visible;
        transition: opacity .55s cubic-bezier(.16, 1, .3, 1), visibility .55s;
      }
      #landing-boot-splash span {
        font: 700 .9rem/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: .16em;
      }
      #landing-boot-splash span::after {
        content: '';
        display: block;
        width: 2.75rem;
        height: 2px;
        margin: 1rem auto 0;
        background: #2de0c4;
        opacity: .7;
      }
      html.landing-boot.landing-boot-complete #landing-boot-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        html.landing-boot #landing-boot-splash { transition: none; }
      }
    </style>
    <link rel="icon" type="image/png" sizes="128x128" href="/sea-favicon.png?v=6" />
    <title>SEA-IT-SOLVED | Smart Whiteboard</title>
    <script>
      (() => {
        const landingBoot = location.pathname === '/' || location.pathname === '/index.html';
        document.documentElement.classList.toggle('landing-boot', landingBoot);
        if (landingBoot) {
          const poster = document.createElement('link');
          poster.rel = 'preload';
          poster.as = 'image';
          poster.href = '/videos/sea-it-solved-capture-clear-poster.webp';
          poster.fetchPriority = 'high';
          document.head.appendChild(poster);
        }
        const key = 'sea-it-solved-theme';
        const saved = localStorage.getItem(key);
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="landing-boot-splash" role="status" aria-label="Loading SEA-IT-SOLVED"><span>SEA-IT-SOLVED</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
